name: Build FIPS OpenSearch image

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 3.9.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 3.9.0)'
        required: false
        default: ''
permissions:
  packages: write
  contents: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.57.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push amd64 image
        id: push
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-opensearch-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-amd64
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-amd64 | cut -d@ -f2)
          echo \"digest=${DIGEST}\" >> \"$GITHUB_OUTPUT\"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-amd64
          path: .build/opensearch-fips-build/*.cdx.json
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.57.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push arm64 image
        id: push
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-opensearch-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-arm64
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-arm64 | cut -d@ -f2)
          echo \"digest=${DIGEST}\" >> \"$GITHUB_OUTPUT\"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-arm64
          path: .build/opensearch-fips-build/*.cdx.json
          if-no-files-found: error

  push-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    outputs:
      image_digest: ${{ steps.manifest.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        id: manifest
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          docker manifest create \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION} \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-amd64 \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-arm64
          docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}
          DIGEST=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64, push-manifest]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download amd64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-amd64
          path: sbom/
      - name: Download arm64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-arm64
          path: sbom/
      - name: Attest amd64 image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch
          subject-digest: ${{ needs.build-amd64.outputs.image_digest }}
          push-to-registry: true
      - name: Attest arm64 image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch
          subject-digest: ${{ needs.build-arm64.outputs.image_digest }}
          push-to-registry: true
      - name: Attest SBOMs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom/*.cdx.json
      - name: Generate SLSA provenance
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_DIGEST: ${{ needs.push-manifest.outputs.image_digest }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          python3 generate-provenance.py \
            --app opensearch \
            --version "${VERSION}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest }}" \
            --sbom-dir sbom/ \
            --output /tmp/provenance.json

      - name: Publish GitHub Release with SBOMs
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          {
            echo "FIPS-enabled OpenSearch image v${VERSION}"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}"
            echo '```'
            echo ""
            echo "## Verify attestations"
            echo ""
            echo "### Container images"
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-amd64 --repo ${{ github.repository }}"
            echo "gh attestation verify oci://ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-arm64 --repo ${{ github.repository }}"
            echo '```'
            echo ""
            echo "### SBOMs"
            echo '```'
            echo "curl -LO https://github.com/${{ github.repository }}/releases/download/v${VERSION}/gl-fips-opensearch-${VERSION}-amd64.cdx.json"
            echo "curl -LO https://github.com/${{ github.repository }}/releases/download/v${VERSION}/gl-fips-opensearch-${VERSION}-arm64.cdx.json"
            echo "gh attestation verify gl-fips-opensearch-${VERSION}-amd64.cdx.json --repo ${{ github.repository }}"
            echo "gh attestation verify gl-fips-opensearch-${VERSION}-arm64.cdx.json --repo ${{ github.repository }}"
            echo '```'
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            || gh release edit "v${VERSION}" \
                 --repo "${{ github.repository }}" \
                 --title "v${VERSION}" \
                 --notes-file /tmp/release-notes.md
          gh release upload "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --clobber \
            sbom/*.cdx.json \
            /tmp/provenance.json
