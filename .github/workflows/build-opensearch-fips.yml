name: Build FIPS OpenSearch image

on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 3.9.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 3.9.0)'
        required: false
        default: ''
permissions:
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 image
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-opensearch-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push arm64 image
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-opensearch-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-arm64

  push-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-opensearch-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          docker manifest create \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION} \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-amd64 \
            ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}-arm64
          docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-opensearch:${VERSION}
