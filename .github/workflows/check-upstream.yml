name: Check upstream OpenSearch release

on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream GitHub repo (owner/name)'
        required: false
        default: 'opensearch-project/OpenSearch'
      build_workflow:
        description: 'Workflow file to trigger on new release'
        required: false
        default: 'build-opensearch-fips.yml'
      stable_only:
        description: 'Only consider stable releases? Set to "no" to include dev/rc tags'
        required: false
        default: 'yes'

permissions: {}


env:
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'opensearch-project/OpenSearch' }}
  BUILD_WORKFLOW: ${{ inputs.build_workflow || 'build-opensearch-fips.yml' }}
  STABLE_ONLY: ${{ inputs.stable_only || 'yes' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.compare.outputs.new_version }}
    steps:
      - name: Fetch latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release view --repo "${UPSTREAM_REPO}" --json tagName -q '.tagName | ltrimstr("v")' 2>/dev/null || true)
          if [ -z "${latest}" ]; then
            if [ "${STABLE_ONLY}" = "yes" ]; then
              latest=$(gh api repos/${UPSTREAM_REPO}/tags --jq '[.[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]')
            else
              latest=$(gh api repos/${UPSTREAM_REPO}/tags --jq '.[0].name | ltrimstr("v")')
            fi
          fi
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      - name: Fetch last built version
        id: last_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name | ltrimstr("v")')
          echo "version=${last}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          latest="${{ steps.upstream.outputs.version }}"
          last="${{ steps.last_built.outputs.version }}"
          echo "Upstream latest : ${latest}"
          echo "Last built      : ${last}"

          if [ -z "${latest}" ]; then
            echo "Could not determine upstream version; aborting." >&2
            exit 1
          fi

          if [ "${latest}" = "${last}" ]; then
            echo "Already up-to-date (${latest}); nothing to do."
            echo "new_version=" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected: ${latest} (previously ${last})"
            echo "new_version=${latest}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new_version != ''
    uses: ./.github/workflows/build-opensearch-fips.yml
    with:
      version: ${{ needs.check.outputs.new_version }}
    permissions:
      packages: write
      contents: write
      id-token: write
      attestations: write

  push-release-branch:
    runs-on: ubuntu-24.04
    needs: [check, build]
    if: needs.check.outputs.new_version != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Push release branch
        env:
          VERSION: ${{ needs.check.outputs.new_version }}
        run: |
          BRANCH="release/v${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # If branch already exists remotely, the version bump is already committed.
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists; nothing to do."
            exit 0
          fi

          git checkout -b "${BRANCH}"
          sed -i 's|^VERSION="${VERSION:-[^}]*}"|VERSION="${VERSION:-'"${VERSION}"'}"|' \
            build-opensearch-fips.sh
          git add build-opensearch-fips.sh
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "chore: bump default version to ${VERSION}"
          git push origin "${BRANCH}"
